<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AirWing NCC</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body class="auth-container" style="height: auto; padding: 5rem 0;">
    <div class="auth-form" style="max-width: 550px;">
        <div style="display: flex; justify-content: center; margin-bottom: 2rem;">
            <div
                style="width: 60px; height: 60px; background: var(--iaf-saffron); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; font-size: 1.2rem; box-shadow: var(--glow-gold);">
                IAF</div>
        </div>
        <h2>CADET REGISTRATION</h2>
        <p
            style="text-align: center; color: rgba(255,255,255,0.6); margin-bottom: 2.5rem; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">
            INITIALIZE CADET DATABASE ENTRY</p>

        <form id="registerForm">
            <div id="registrationFields">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label>FULL NAME</label>
                    <input type="text" id="name" required placeholder="J. DOE">
                </div>
                <div class="form-group">
                    <label>USERNAME</label>
                    <input type="text" id="username" required placeholder="chosen_id">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>

            <div id="cadetFields">
                <div style="margin: 2rem 0; height: 1px; background: rgba(255,255,255,0.1);"></div>
                <h4 style="color: var(--iaf-saffron); margin-bottom: 1.5rem; font-size: 0.9rem; letter-spacing: 1px;">
                    CADET INFORMATION</h4>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label>REGIMENTAL NO</label>
                        <input type="text" id="cadet_id" placeholder="NCC/AW/XXXX">
                    </div>
                    <div class="form-group">
                        <label>RANK</label>
                        <input type="text" id="department" placeholder="Engineers / Pilots">
                    </div>
                    <div class="form-group">
                        <label>MOBILE NUMBER</label>
                        <input type="text" id="contact" placeholder="+91 XXXX">
                    </div>
                    <div class="form-group">
                        <label>COLLEGE MAIL</label>
                        <input type="email" id="email" placeholder="cadet@squadron.com">
                    </div>
                </div>
            </div>

            </div>
            
            <button type="button" class="btn btn-primary" id="continueBtn" style="width: 100%; margin-top: 2rem;">NEXT: VERIFICATION</button>
            <p style="text-align: center; margin-top: 2rem; font-size: 0.85rem; color: rgba(255,255,255,0.5);">Already
                Enlisted? <a href="login.html"
                    style="color: var(--iaf-sky); text-decoration: none; font-weight: 700;">LOGIN</a></p>
            
            <div id="otpSection" style="display: none; margin-top: 2rem; text-align: center;">
                <h4 style="color: var(--iaf-saffron); margin-bottom: 1rem;">ENTER VERIFICATION CODE</h4>
                <p style="color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 1.5rem;">A 6-digit code has been sent to your email.</p>
                <div class="form-group">
                    <input type="text" id="otp_code" placeholder="XXXXXX" style="text-align: center; letter-spacing: 5px; font-size: 1.2rem;" maxlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">FINALIZE ENLISTMENT</button>
            </div>
        </form>
    </div>

    <script>
        let currentUsername = '';

        document.getElementById('continueBtn').addEventListener('click', async () => {
            const role = 'Student'; // Hardcoded role
            const email = document.getElementById('email').value;
            currentUsername = document.getElementById('username').value;
            
            if(!currentUsername || !email) {
                alert("Please fill out all fields before continuing.");
                return;
            }

            const payload = {
                name: document.getElementById('name').value,
                username: currentUsername,
                password: document.getElementById('password').value,
                role: role
            };

            payload.cadetDetails = {
                name: payload.name,
                cadet_id: document.getElementById('cadet_id').value,
                department: document.getElementById('department').value,
                contact: document.getElementById('contact').value,
                email: email
            };

            document.getElementById('continueBtn').disabled = true;
            document.getElementById('continueBtn').innerText = 'SENDING CODE...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('registrationFields').style.display = 'none';
                    document.getElementById('continueBtn').style.display = 'none';
                    document.getElementById('otpSection').style.display = 'block';
                } else {
                    alert(data.message);
                    document.getElementById('continueBtn').disabled = false;
                    document.getElementById('continueBtn').innerText = 'NEXT: VERIFICATION';
                }
            } catch (err) {
                alert("An error occurred during registration.");
                document.getElementById('continueBtn').disabled = false;
                document.getElementById('continueBtn').innerText = 'NEXT: VERIFICATION';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otp_code = document.getElementById('otp_code').value;
            if(!otp_code) return alert("Please enter the OTP.");

            const response = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, otp_code })
            });

            const data = await response.json();
            if (response.ok) {
                alert('Verification successful! Proceed to authentication terminal.');
                window.location.href = 'login.html';
            } else {
                alert(data.message);
            }
        });
    </script>
</body>

</html>
